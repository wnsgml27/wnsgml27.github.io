<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Junehee</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<!--
  Every page lives in this one file for now: each <section class="view">
  is shown or hidden by main.js based on the #hash in the URL
  (#about, #projects, #bookmarks, #kitchen).
-->
<header class="site">
  <div class="wrap">
    <a class="wordmark" href="#home">junehee<span>.io</span></a>
    <nav class="top" aria-label="Main">
      <a href="#about" data-view="about"><span class="key">[A]</span> about</a>
      <a href="#projects" data-view="projects"><span class="key">[P]</span> projects</a>
      <a href="#bookmarks" data-view="bookmarks"><span class="key">[L]</span> bookmarks</a>
      <a href="#kitchen" data-view="kitchen" class="nav-kitchen" hidden><span class="key">[K]</span> kitchen</a>
    </nav>
  </div>
</header>

<main>
  <div class="wrap">

    <!-- ===== HOME (index.html) ===== -->
    <section class="view" id="view-home" data-title="home">
      <h1 class="hello reveal">Hi, I'm Junehee<span class="wave">!</span></h1>
      <nav class="home-links reveal" aria-label="Sections">
        <a class="slide-link" href="#about"><span class="key">[A]</span> about</a>
        <a class="slide-link" href="#projects"><span class="key">[P]</span> projects</a>
        <a class="slide-link" href="#bookmarks"><span class="key">[L]</span> bookmarks</a>
      </nav>
    </section>

    <!-- ===== ABOUT (about/index.html) ===== -->
    <section class="view" id="view-about" data-title="about" hidden>
      <p class="eyebrow reveal">about</p>

      <!-- Empty for now. Example layout, remove the comment marks to use it:
      <div class="about-grid">
        <img class="photo reveal" src="me.jpg" alt="Junehee">
        <div class="about-text">
          <p class="reveal">A few sentences about you.</p>
          <div class="contact reveal">
            <div><span class="muted">github</span><a class="slide-link" href="https://github.com/your-name">your-name</a></div>
          </div>
        </div>
      </div>
      -->
    </section>

    <!-- ===== PROJECTS (projects/index.html) ===== -->
    <section class="view" id="view-projects" data-title="projects" hidden>
      <p class="eyebrow reveal">projects</p>

      <div>
        <div class="tabs reveal" role="tablist" aria-label="Project type">
          <button class="tab" role="tab" id="tab-math" aria-controls="panel-math" aria-selected="true" type="button"><span class="key">[M]</span> math</button>
          <button class="tab" role="tab" id="tab-cs" aria-controls="panel-cs" aria-selected="false" type="button"><span class="key">[C]</span> cs</button>
        </div>
      </div>

      <!-- Empty for now. To add a project, put a card like this inside a panel below:
      <a class="card reveal" href="https://example.com">
        <h3>Project name</h3><time>2026</time>
        <p>One line about it.</p>
        <span class="go">open →</span>
      </a>
      -->
      <div class="cards" role="tabpanel" id="panel-math" aria-labelledby="tab-math"></div>
      <div class="cards" role="tabpanel" id="panel-cs" aria-labelledby="tab-cs" hidden></div>
    </section>

    <!-- ===== BOOKMARKS (bookmarks/index.html) ===== -->
    <section class="view" id="view-bookmarks" data-title="bookmarks" hidden>
      <p class="eyebrow reveal">bookmarks</p>

      <!-- Empty for now. To add a topic, copy this block and remove the comment marks:
      <div class="topic">
        <h2 class="reveal">topic name</h2>
        <ul class="marks">
          <li class="reveal"><a class="slide-link" href="https://example.com">site name</a><span>One line on why you like it.</span></li>
        </ul>
      </div>
      -->
    </section>

    <!-- ===== KITCHEN (kitchen/index.html): only reachable after FULL MODE ===== -->
    <section class="view" id="view-kitchen" data-title="kitchen" hidden>
      <p class="eyebrow reveal">kitchen</p>

      <!-- The photo tiles are made by main.js from the "dishes" list. -->
      <div class="grid" id="kitchen-grid"></div>
    </section>

  </div>
</main>

<footer>
  <div class="wrap">
    <span>© 2026 Junehee · junehee.io</span>
    <div class="pad" aria-label="Secret pad">
      <button type="button" data-pad="T" aria-label="up left"></button>
      <button type="button" data-pad="Y" aria-label="up right"></button>
      <button type="button" data-pad="G" aria-label="center"></button>
      <button type="button" data-pad="V" aria-label="down left"></button>
      <button type="button" data-pad="B" aria-label="down right"></button>
    </div>
  </div>
</footer>

<!-- The step chart. Hidden until someone presses V (the first step).
     Only arrows are shown, never the keyboard letters. -->
<div class="chart" id="chart" aria-hidden="true">
  <p class="chart-label">step chart</p>
  <p class="chart-steps" id="chart-steps"></p>
</div>

<!-- The FULL MODE unlock animation. Hidden until the step chart is finished. -->
<div class="fullmode" id="fullmode" role="status">
  <div class="fm-flash"></div>
  <div class="fm-ring"></div>
  <div class="fm-ring"></div>
  <p class="fm-text"><b>FULL</b> MODE</p>
  <p class="fm-sub">kitchen unlocked</p>
</div>

<dialog id="dish-dialog">
  <div class="stack">
    <h2 id="dish-name"></h2>
    <p class="muted" id="dish-note"></p>
    <form method="dialog"><button class="btn" type="submit">close</button></form>
  </div>
</dialog>

<script src="main.js"></script>
</body>
</html>
